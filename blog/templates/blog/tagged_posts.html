{% extends "base.html" %}
{% block content %}
<h2>Posts tagged with "{{ tag.name }}"</h2>

{% for post in posts %}
  <article>
    <h3><a href="{% url 'blog:post_detail' post.slug %}">{{ post.title }}</a></h3>
    <p>{{ post.body|truncatewords:30 }}</p>
  </article>
{% empty %}
  <p>No posts with this tag.</p>
{% endfor %}

<p><a href="{% url 'blog:post_list' %}">Back to all posts</a></p>
{% endblock %}
