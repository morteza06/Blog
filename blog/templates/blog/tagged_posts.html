{% extends "base.html" %}
{% block content %}
<h2><big> پست های تگ شده  با تگه </big>  "{{ tag.name }}"</h2>
<small>فهرست:</small>
{% for post in posts %}
  <article>
    <h3><a href="{% url 'blog:post_detail' post.slug %}">{{ post.title }}</a></h3>
    <p>{{ post.body|truncatewords:30 }}</p>
  </article>
{% empty %}
  <p>No posts with this tag.</p>
{% endfor %}

<h3>
  <p>
  <big><a href="{% url 'blog:post_list' %}">
    بازگشت به همه پست ها
  </a></big>
</p>
</h3>
{% endblock %}
