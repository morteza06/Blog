{% extends "base.html" %}
{% load static %}
{% block content %}

<div class="container mt-4">
  <h2>ویرایش نظر</h2>

  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
      {{ form.content.label_tag }}
      {{ form.content }}
      {% if form.content.errors %}
        <div class="text-danger small mt-1">
          {{ form.content.errors }}
        </div>
      {% endif %}
    </div>

    <button type="submit" class="btn btn-primary">ذخیره تغییرات</button>
    <a href="{% url 'blog:post_detail' comment.post.slug %}" class="btn btn-secondary">انصراف</a>
  </form>
</div>

{% endblock %}
